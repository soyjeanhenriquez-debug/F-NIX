<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto Fénix</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root{
    --bg:#0a0a0a; --card:#151515; --border:#262626;
    --orange:#ff5a1f; --orange-dim:#7a3016;
    --text:#f2f2f2; --sub:#9a9a9a; --green:#3ecf7a; --red:#ff5252;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  header{padding:20px 20px 0;}
  .title{font-size:1.6rem;font-weight:800;}
  .title span{color:var(--orange);}
  .subtitle{color:var(--sub);font-size:0.95rem;margin-top:4px;display:flex;align-items:center;gap:8px;}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;}
  .tabs{display:flex;gap:4px;overflow-x:auto;margin-top:18px;border-bottom:1px solid var(--border);padding:0 20px;}
  .tab{padding:10px 14px;color:var(--sub);font-weight:600;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-size:0.95rem;}
  .tab.active{color:var(--orange);border-color:var(--orange);}
  main{padding:20px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;}
  .card .label{color:var(--sub);font-size:0.78rem;text-transform:uppercase;letter-spacing:0.04em;}
  .card .value{font-size:1.9rem;font-weight:800;margin-top:6px;}
  .card .sub{color:var(--sub);font-size:0.82rem;margin-top:4px;}
  .value.orange{color:var(--orange);}
  .value.green{color:var(--green);}
  .value.red{color:var(--red);}
  .bar-bg{height:6px;background:#262626;border-radius:3px;margin-top:8px;overflow:hidden;position:relative;}
  .bar-min-marker{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.55);}
  .bar-fill{height:100%;background:var(--orange);}
  .section-title{font-size:1.1rem;font-weight:700;margin:24px 0 12px;}
  .entry{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
  .entry-top{display:flex;justify-content:space-between;align-items:baseline;}
  .entry-date{font-weight:700;color:var(--orange);font-size:0.9rem;}
  .entry-meta{color:var(--sub);font-size:0.8rem;}
  .entry-body{margin-top:6px;font-size:0.92rem;line-height:1.4;}
  .macro-row{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap;}
  .macro{font-size:0.82rem;color:var(--sub);}
  .macro b{color:var(--text);}
  .chart-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:12px;}
  .loading{color:var(--sub);text-align:center;padding:40px;}
  .day-badge{display:inline-block;background:var(--orange-dim);color:var(--orange);border-radius:6px;padding:2px 8px;font-size:0.75rem;font-weight:700;margin-left:8px;}
  ::-webkit-scrollbar{height:0;}
  #fab{position:fixed;bottom:24px;right:24px;width:60px;height:60px;border-radius:50%;background:var(--orange);color:#fff;font-size:2rem;border:none;box-shadow:0 4px 16px rgba(255,90,31,0.5);cursor:pointer;z-index:50;line-height:1;}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:100;align-items:flex-end;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--card);border-top:2px solid var(--orange);border-radius:20px 20px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding:20px;}
  .modal-tabs{display:flex;gap:6px;margin-bottom:16px;}
  .mtab{flex:1;text-align:center;padding:10px;background:#0a0a0a;border-radius:10px;color:var(--sub);font-weight:600;cursor:pointer;}
  .mtab.active{background:var(--orange);color:#fff;}
  .mform label{display:block;color:var(--sub);font-size:0.8rem;margin:10px 0 4px;}
  .mform input,.mform select{width:100%;padding:12px;background:#0a0a0a;border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:1rem;}
  .mform textarea{width:100%;padding:12px;background:#0a0a0a;border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:1rem;font-family:inherit;resize:vertical;}
  .calc-btn{width:100%;padding:12px;background:var(--card);color:var(--orange);border:1px solid var(--orange);border-radius:10px;font-weight:700;margin-top:10px;cursor:pointer;font-size:0.95rem;}
  .desglose{font-size:0.8rem;color:var(--sub);margin-top:10px;line-height:1.5;}
  .desglose-total{color:var(--text);font-weight:700;margin-top:6px;padding-top:6px;border-top:1px solid var(--border);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .hint{color:var(--green);font-size:0.82rem;margin-top:6px;min-height:1rem;}
  .save-btn{width:100%;padding:15px;background:var(--orange);color:#fff;border:none;border-radius:12px;font-size:1.05rem;font-weight:700;margin-top:18px;cursor:pointer;}
  .close-btn{width:100%;padding:12px;background:transparent;color:var(--sub);border:none;margin-top:8px;cursor:pointer;}
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;padding:12px 24px;border-radius:24px;font-weight:700;opacity:0;transition:opacity 0.3s;z-index:200;pointer-events:none;}
  .toast.show{opacity:1;}
  .ex-row{padding:12px 0;border-bottom:1px solid var(--border);}
  .ex-row:last-child{border-bottom:none;}
  .ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .ex-name{font-weight:700;font-size:0.98rem;}
  .ex-load{color:var(--text);font-size:0.9rem;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .prog{display:inline-block;margin-top:5px;font-size:0.8rem;font-weight:700;padding:2px 8px;border-radius:6px;font-variant-numeric:tabular-nums;}
  .prog.up{background:rgba(62,207,122,0.15);color:var(--green);}
  .prog.down{background:rgba(255,82,82,0.15);color:var(--red);}
  .prog.same{background:#262626;color:var(--sub);}
  .prog.new{background:var(--orange-dim);color:var(--orange);}
  .ex-note{color:var(--sub);font-size:0.8rem;margin-top:5px;line-height:1.35;}
  .ex-num{display:inline-block;background:var(--orange-dim);color:var(--orange);font-size:0.72rem;font-weight:800;padding:1px 6px;border-radius:5px;margin-right:7px;}
  .ex-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;}
  .obj{display:inline-block;font-size:0.78rem;font-weight:700;padding:2px 8px;border-radius:6px;}
  .obj.ok{background:rgba(62,207,122,0.12);color:var(--green);}
  .obj.bajo{background:rgba(255,180,0,0.12);color:#ffb400;}
  .cardio-block{margin-top:12px;padding-top:10px;border-top:1px dashed var(--border);}
  .cardio-title{font-size:0.82rem;font-weight:700;color:var(--sub);margin-bottom:5px;}
  .protocolo{background:linear-gradient(135deg,rgba(255,90,31,0.12),rgba(255,90,31,0.03));border:1px solid var(--orange-dim);border-radius:14px;padding:14px 16px;margin-bottom:8px;}
  .protocolo.rest{background:linear-gradient(135deg,rgba(62,207,122,0.1),rgba(62,207,122,0.02));border-color:rgba(62,207,122,0.3);}
  .proto-head{font-weight:800;font-size:1rem;margin-bottom:6px;}
  .proto-line{font-size:0.86rem;color:var(--sub);margin-top:4px;line-height:1.35;}
  .proto-tap{float:right;font-size:0.78rem;color:var(--orange);font-weight:700;}
  .mes-badge{display:inline-block;background:var(--orange);color:#fff;font-size:0.62rem;font-weight:800;padding:2px 6px;border-radius:5px;vertical-align:middle;letter-spacing:0.04em;}
  .core-extra{background:rgba(255,90,31,0.08);border-radius:10px;padding:10px 12px;margin:8px 0;}
  .core-extra-h{font-size:0.82rem;font-weight:700;color:var(--orange);margin-bottom:6px;}
  .core-extra-item{font-size:0.83rem;color:var(--sub);line-height:1.45;margin-top:3px;}
  .core-extra-item b{color:var(--text);}
  .dia-panel{padding-bottom:20px;}
  .dia-panel-head{display:flex;justify-content:space-between;align-items:center;font-size:1.15rem;font-weight:800;margin:8px 0 16px;}
  .dia-close{background:var(--card);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:50%;font-size:1rem;cursor:pointer;}
  .dia-ex{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
  .dia-ex-top{display:flex;justify-content:space-between;align-items:center;}
  .dia-ex-name{font-weight:700;font-size:0.98rem;}
  .dia-ex-grp{font-size:0.72rem;color:var(--sub);text-transform:uppercase;letter-spacing:0.04em;}
  .dia-ex-specs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .spec{font-size:0.82rem;padding:3px 9px;border-radius:7px;background:#0a0a0a;color:var(--sub);font-weight:600;}
  .spec.sug{background:var(--orange-dim);color:var(--orange);}
  .spec.mejora{background:rgba(62,207,122,0.15);color:var(--green);}
  .spec.new{background:rgba(255,180,0,0.12);color:#ffb400;}
  .spec.desc{background:rgba(120,120,255,0.12);color:#9a9aff;}
  .dia-cardio-note{margin-top:14px;padding:12px;background:#0a0a0a;border-radius:10px;font-size:0.84rem;color:var(--sub);}
  #ptr{position:fixed;top:-50px;left:50%;transform:translateX(-50%);width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--orange);color:var(--orange);display:flex;align-items:center;justify-content:center;font-size:1.3rem;z-index:80;opacity:0;transition:opacity 0.15s;}
  #ptr.spin{animation:ptrspin 0.7s linear infinite;}
  @keyframes ptrspin{from{transform:translateX(-50%) rotate(0)}to{transform:translateX(-50%) rotate(360deg)}}
  .daytype{font-size:0.68rem;background:#0a0a0a;color:var(--sub);padding:2px 7px;border-radius:5px;margin-left:6px;font-weight:700;letter-spacing:0.03em;}
  .cal-badge{font-size:0.82rem;font-weight:700;padding:4px 10px;border-radius:8px;white-space:nowrap;}
  .cal-badge.ok{background:rgba(62,207,122,0.15);color:var(--green);}
  .cal-badge.ambar{background:rgba(255,180,0,0.15);color:#ffb400;}
  .cal-badge.rojo{background:rgba(255,82,82,0.18);color:var(--red);}
  .prot-line{font-size:0.85rem;color:var(--sub);margin:8px 0 4px;}
  .guia-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
  .guia-h{font-weight:800;font-size:1rem;margin-bottom:10px;}
  .guia-ul{margin:0;padding-left:18px;}
  .guia-ul li{font-size:0.88rem;color:var(--sub);line-height:1.55;margin-bottom:4px;}
  .guia-ul li b{color:var(--text);}
  .entry.score-ok{border-left:3px solid var(--green);}
  .menu-base-card{background:var(--card);border:1px solid var(--orange-dim);border-radius:12px;padding:14px 16px;margin-bottom:16px;}
  .menu-base-h{font-weight:700;color:var(--orange);margin-bottom:10px;font-size:0.95rem;}
  .menu-base-momento{margin-bottom:8px;}
  .menu-base-momento b{font-size:0.85rem;}
  .menu-base-items{color:var(--sub);font-size:0.82rem;line-height:1.4;}
  .menu-base-meta{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);color:var(--sub);font-size:0.78rem;line-height:1.5;}
  .entry.score-ambar{border-left:3px solid #ffb400;}
  .entry.score-rojo{border-left:3px solid var(--red);}
  .score-badge{font-size:0.78rem;font-weight:800;padding:4px 10px;border-radius:8px;white-space:nowrap;}
  .score-badge.ok{background:rgba(62,207,122,0.18);color:var(--green);}
  .score-badge.ambar{background:rgba(255,180,0,0.18);color:#ffb400;}
  .score-badge.rojo{background:rgba(255,82,82,0.2);color:var(--red);}
  .score-detail{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;}
  .chk{font-size:0.78rem;font-weight:600;padding:2px 8px;border-radius:6px;background:#0a0a0a;}
  .chk.y{color:var(--green);}
  .chk.m{color:#ffb400;}
  .chk.n{color:var(--red);}
  .faltan{background:rgba(255,180,0,0.12);color:#ffb400;font-size:0.82rem;font-weight:600;padding:8px 10px;border-radius:8px;margin-bottom:8px;}
  .com-faltan{font-size:0.85rem;color:var(--sub);margin-bottom:10px;min-height:1rem;}
  .com-frecuentes{margin-bottom:12px;}
  .frec-label{font-size:0.78rem;color:var(--sub);margin-bottom:6px;font-weight:600;}
  .frec-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .frec-chip{background:#0a0a0a;border:1px solid var(--orange-dim);color:var(--text);font-size:0.82rem;padding:6px 11px;border-radius:16px;cursor:pointer;}
  .frec-chip b{color:var(--orange);}
  .pill-falta{display:inline-block;background:var(--orange-dim);color:var(--orange);padding:3px 10px;border-radius:12px;font-weight:700;cursor:pointer;margin:2px;}
  .reco-header{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--orange);border-radius:12px;padding:14px 16px;margin-bottom:12px;}
  .reco-title{font-weight:800;font-size:0.95rem;margin-bottom:8px;}
  .reco-item{display:flex;gap:8px;font-size:0.85rem;color:var(--sub);line-height:1.4;margin-top:6px;}
  .reco-item span:first-child{flex-shrink:0;}
  .foto-banner{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,rgba(255,90,31,0.18),rgba(255,90,31,0.05));border:1px solid var(--orange);border-radius:12px;padding:14px 16px;margin-bottom:12px;font-size:0.9rem;line-height:1.4;}
  .foto-banner span:first-child{font-size:1.3rem;}
  .agua-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
  .agua-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .agua-label{font-weight:700;}
  .agua-val{font-weight:800;font-size:1.2rem;}
  .agua-btns{display:flex;gap:8px;margin-top:12px;}
  .agua-btns button{flex:1;padding:11px 0;background:#0a0a0a;border:1px solid var(--orange);color:var(--orange);border-radius:9px;font-weight:700;font-size:0.9rem;cursor:pointer;}
  .agua-btns button.agua-menos{border-color:var(--border);color:var(--sub);flex:0.7;}
  .hipo-card{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px;}
  .hipo-card.done{border-color:var(--green);}
  .hipo-title{font-weight:700;}
  .hipo-sub{font-size:0.8rem;color:var(--sub);margin-top:3px;}
  .hipo-btn{padding:10px 18px;background:#0a0a0a;border:1px solid var(--orange);color:var(--orange);border-radius:9px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .hipo-btn.on{background:var(--green);border-color:var(--green);color:#000;}
  .ritmo-card{background:linear-gradient(135deg,rgba(255,90,31,0.12),rgba(255,90,31,0.03));border:1px solid var(--orange-dim);border-radius:14px;padding:16px;margin-bottom:12px;}
  .ritmo-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;flex-wrap:wrap;gap:4px;}
  .ritmo-title{font-weight:800;font-size:1rem;}
  .ritmo-pace{font-size:0.75rem;color:var(--sub);}
  .ritmo-row{display:flex;gap:8px;}
  .ritmo-box{flex:1;background:#0a0a0a;border-radius:10px;padding:10px;text-align:center;}
  .ritmo-lbl{font-size:0.7rem;color:var(--sub);text-transform:uppercase;}
  .ritmo-val{font-size:1.1rem;font-weight:800;margin-top:3px;}
  .ritmo-msg{margin-top:10px;font-size:0.82rem;font-weight:600;padding:8px;border-radius:8px;text-align:center;}
  .ritmo-msg.ok{background:rgba(62,207,122,0.12);color:var(--green);}
  .ritmo-msg.off{background:rgba(255,82,82,0.12);color:var(--red);}
  .check-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
  .check-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:800;font-size:0.95rem;}
  .check-score{font-size:0.78rem;padding:3px 10px;border-radius:8px;}
  .check-score.ok{background:rgba(62,207,122,0.18);color:var(--green);}
  .check-score.ambar{background:rgba(255,180,0,0.18);color:#ffb400;}
  .check-score.rojo{background:rgba(255,82,82,0.18);color:var(--red);}
  .check-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
  .check-item:last-child{border-bottom:none;}
  .check-box{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.85rem;font-weight:800;flex-shrink:0;}
  .check-box.on{background:var(--green);border-color:var(--green);color:#000;}
  .check-ic{font-size:1rem;}

  /* --- Transformación al completar el día (Super Saiyan / Super Saiyan Blue) --- */
  .ssj-flash{position:fixed;inset:0;z-index:300;pointer-events:none;opacity:0;}
  .ssj-flash.ssj1{background:radial-gradient(circle at 50% 30%, rgba(255,210,63,.38), rgba(255,90,31,.16) 42%, transparent 72%);}
  .ssj-flash.ssj2{background:radial-gradient(circle at 50% 30%, rgba(255,255,220,.48), rgba(255,210,63,.2) 40%, transparent 72%);}
  .ssj-flash.ssj4{background:radial-gradient(circle at 50% 30%, rgba(255,60,40,.42), rgba(10,8,8,.3) 45%, transparent 75%);}
  .ssj-flash.ssjb{background:radial-gradient(circle at 50% 30%, rgba(120,200,255,.38), rgba(56,189,248,.16) 42%, transparent 72%);}
  .ssj-flash.show{animation:ssjFlash .75s ease-out forwards;}
  .ssj-flash.ssj2.show{animation:ssjFlashFlicker .8s ease-out forwards;}
  @keyframes ssjFlash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
  @keyframes ssjFlashFlicker{0%{opacity:0}10%{opacity:1}22%{opacity:.3}34%{opacity:1}50%{opacity:.4}100%{opacity:0}}
  .ssj-particle{position:fixed;border-radius:50%;pointer-events:none;z-index:301;transform:translate(0,0) scale(1);opacity:1;}
  .ssj-particle.ssj1{background:linear-gradient(180deg,#fff6d0,#ffd23f);box-shadow:0 0 8px #ffd23f;}
  .ssj-particle.ssj2{background:linear-gradient(180deg,#ffffff,#ffe27a);box-shadow:0 0 12px #fff2b0;}
  .ssj-particle.ssj4{background:linear-gradient(180deg,#ff6a4d,#c81e0e);box-shadow:0 0 10px #ff3b1f;}
  .ssj-particle.ssj4b{background:linear-gradient(180deg,#3a2a28,#0d0808);box-shadow:0 0 8px #ff3b1f;}
  .ssj-particle.ssjb{background:linear-gradient(180deg,#e3f6ff,#38bdf8);box-shadow:0 0 8px #38bdf8;}
  .ssj-particle.rise{animation:ssjRise var(--dur) ease-out forwards;}
  @keyframes ssjRise{0%{transform:translate(0,0) scale(1);opacity:1}65%{opacity:.9}100%{transform:translate(var(--tx),var(--ty)) scale(.15);opacity:0}}
  .check-card.ssj-charge{animation:ssjShake .5s ease-in-out;box-shadow:0 0 0 1px var(--border),0 0 30px 4px rgba(255,210,63,.35);}
  .check-card.ssj-charge.ssj2{animation:ssjShake .5s ease-in-out,ssjFlicker .5s ease-in-out;box-shadow:0 0 0 1px var(--border),0 0 36px 6px rgba(255,240,180,.5);}
  .check-card.ssj-charge.ssj4{box-shadow:0 0 0 1px var(--border),0 0 36px 6px rgba(255,59,31,.45);}
  .check-card.ssj-charge.ssjb{box-shadow:0 0 0 1px var(--border),0 0 34px 6px rgba(56,189,248,.4);}
  @keyframes ssjShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
  /* Vibracion de pantalla completa durante la transformacion */
  .ssj-vibrate{animation:ssjVibrate .15s ease-in-out infinite;}
  @keyframes ssjVibrate{
    0%,100%{transform:translate(0,0) rotate(0deg)}
    20%{transform:translate(-2px,2px) rotate(-1deg)}
    40%{transform:translate(-3px,-1px) rotate(1.5deg)}
    60%{transform:translate(3px,2px) rotate(-1.5deg)}
    80%{transform:translate(1px,-3px) rotate(1deg)}
  }
  @keyframes ssjFlicker{0%,100%{filter:brightness(1)}25%{filter:brightness(1.6)}50%{filter:brightness(.9)}75%{filter:brightness(1.5)}}

function ejerciciosDelDia(diaReto, fecha){

      .map(x=>({nombre:x.n, o:x.o, d:x.d, g:x.g, reps:x.reps, series:x.series, desc:x.desc, hist:x.hist}));
  }

    .reduce((acc,[k,v])=>{ if(!acc.find(x=>x.o===v.o)) acc.push({nombre:k,...v}); return acc; },[]);
  if(diaReto===3){ DIA3_EXTRA.forEach(ex=>{ if(!lista.find(x=>x.o===ex.o)) lista.push({...ex, d:3}); }); }

// busca el ultimo peso de un ejercicio, cruzando historial Mes1 <-> Mes2
function ultimoPesoDe(ej, fechaRef){
  const candidatos = state.ejercicios.filter(e=>{
    if(!e.peso) return false;
    const ne = normEj(e.ejercicio);
    if(ne===normEj(ej.nombre)) return true;
    if(ej.hist && ej.hist.some(h=>normEj(h)===ne)) return true;
    if(enMismoGrupo(e.ejercicio, ej.nombre)) return true;
    const info = renfitInfo(e.ejercicio);
    if(!esMes2(fechaRef) && info && info.o===ej.o && info.d===ej.d){
      const esAmbiguo = DIA3_EXTRA.some(x=>x.o===ej.o) && ej.d===3;
      if(esAmbiguo) return diaRetoDeFecha(e.fecha)===3;
      return true;
    }
    return false;
  }).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  return candidatos.length ? candidatos[0] : null;
}

// ============ MOTOR DE PROGRESION INTELIGENTE ============
// Decide SUBE / MANTEN / BAJA segun reps logradas vs objetivo + RIR reportado
// y ajusta el salto de peso a los INCREMENTOS REALES del equipo del gym.
function rangoReps(repsStr){
  const s = String(repsStr||'');
  const nums = s.match(/\d+/g);
  if(!nums) return {min:8, max:12};
  if(nums.length>=2) return {min:parseInt(nums[0]), max:parseInt(nums[1])};
  const n = parseInt(nums[0]);
  return {min:n, max:n};
}
// incremento minimo real segun tipo de equipo (en lb)
function incrementoDe(nombreEj){
  const n = normEj(nombreEj);
  if(n.includes('mancuerna')) return 5;              // rack sube de 5 en 5 por mancuerna
  if(n.includes('soga')||n.includes('polea')||n.includes('cable')) return 5;
  if(n.includes('barra')||n.includes('smith')) return 5;   // 2.5 lb por lado
  if(n.includes('prensa')||n.includes('leg press')) return 10; // discos grandes
  if(n.includes('talones')) return 10;               // suelen ser stacks pesados
  if(n.includes('maquina')||n.includes('pulldown')||n.includes('jalon')||n.includes('press')||n.includes('curl')||n.includes('fly')||n.includes('pec deck')||n.includes('thrust')||n.includes('abduc')||n.includes('adduc')||n.includes('extension')) return 10; // stack tipico
  return 5;
}
// calcula el proximo peso real alcanzable
function siguientePeso(pesoActual, factor, nombreEj){
  const inc = incrementoDe(nombreEj);
  const ideal = pesoActual * factor;
  let saltos = Math.round((ideal - pesoActual) / inc);
  if(saltos < 1) saltos = 1;                          // minimo un incremento
  const nuevo = pesoActual + saltos * inc;
  const pctReal = ((nuevo - pesoActual) / pesoActual) * 100;
  return {nuevo, inc, pctReal};
}
function bajarPeso(pesoActual, nombreEj){
  const inc = incrementoDe(nombreEj);
  let saltos = Math.max(1, Math.round((pesoActual*0.08)/inc));
  const nuevo = Math.max(inc, pesoActual - saltos*inc);
  return {nuevo, inc};
}
const SALTO_MAX_PCT = 12; // si el incremento minimo supera esto, mejor subir reps

function decisionProgresion(ej, ultimoReg){
  if(!ultimoReg || !ultimoReg.peso){
    return {accion:'nuevo', txt:'Primera vez — calibra con un peso que puedas controlar', cls:'nuevo', sug:null};
  }
  const {min, max} = rangoReps(ej.reps);
  const repsHechas = ultimoReg.reps || 0;
  const rir = (ultimoReg.rir===null || ultimoReg.rir===undefined) ? null : Number(ultimoReg.rir);
  const p = Number(ultimoReg.peso);
  const nom = ej.nombre;

  // helper: propone subida real o progresion doble si el salto es muy grande
  const proponerSubida = (factor, motivo) => {
    const {nuevo, inc, pctReal} = siguientePeso(p, factor, nom);
    if(pctReal > SALTO_MAX_PCT){
      return {accion:'reps', cls:'manten', sug:p,
        txt:`${motivo} — pero el salto mínimo aquí es +${inc} lb (${pctReal.toFixed(0)}%, demasiado). Mantén ${p} lb y sube reps hasta ${max+2}`};
    }
    return {accion:'sube', cls:'sube', sug:nuevo,
      txt:`${motivo}. Sube a ${nuevo} lb (+${inc} lb${pctReal?', '+pctReal.toFixed(0)+'%':''})`};
  };

  // sin RIR registrado: decision solo por reps (modo compatible con historial viejo)
  if(rir===null){
    if(repsHechas >= max) return proponerSubida(1.05, `Completaste el rango (${repsHechas} reps)`);
    if(repsHechas < min){
      const {nuevo, inc} = bajarPeso(p, nom);
      return {accion:'baja', cls:'baja', sug:nuevo, txt:`No llegaste al mínimo (${repsHechas}/${min}). Baja a ${nuevo} lb (−${inc}) y consolida forma`};
    }
    return {accion:'manten', cls:'manten', sug:p, txt:`En rango (${repsHechas} reps). Mantén ${p} lb hasta llegar a ${max}`};
  }

  // con RIR: decision fina
  if(repsHechas >= max && rir >= 2){
    return proponerSubida(rir>=3?1.075:1.05, `${repsHechas} reps con RIR ${rir} — te sobró tanque`);
  }
  if(repsHechas >= max && rir <= 1){
    return {accion:'manten', cls:'manten', sug:p, txt:`${repsHechas} reps pero RIR ${rir} (casi al fallo). Consolida en ${p} lb una sesión más`};
  }
  if(repsHechas < min){
    const {nuevo, inc} = bajarPeso(p, nom);
    return {accion:'baja', cls:'baja', sug:nuevo, txt:`Solo ${repsHechas}/${min} reps. Baja a ${nuevo} lb (−${inc}) y recupera técnica`};
  }
  if(rir >= 3){
    return proponerSubida(1.05, `RIR ${rir} — el peso está flojo aunque no cerraste rango`);
  }
  return {accion:'manten', cls:'manten', sug:p, txt:`${repsHechas} reps, RIR ${rir}. Mantén ${p} lb y busca llegar a ${max}`};
}
function normEj(nombre){
  return nombre.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
}
function renfitInfo(nombre){ return RENFIT[normEj(nombre)] || null; }
// Version unificada: RENFIT es solo el diccionario de Mes1. Para que el orden de
// ejecucion, el numero #o y el objetivo de reps funcionen tambien en Mes2, hay que
// buscar ademas en el arreglo MES2 (por nombre exacto o por sus alias en hist[]).
function diaInfoDe(nombre){
  const legacy = RENFIT[normEj(nombre)];
  if(legacy) return legacy;
  const ne = normEj(nombre);
  return MES2.find(m => normEj(m.n)===ne || (m.hist && m.hist.some(h=>normEj(h)===ne))) || null;
}

}

// parsea texto multilinea -> {cal,prot,carb,gra, agua, lineas:[...]}
function parseComida(texto){
  const res = {cal:0,prot:0,carb:0,gra:0,agua:0,lineas:[],desconocidos:[]};
  texto.split(/[\n,]/).forEach(raw => {
    const linea = raw.trim(); if(!linea) return;
    const nlinea = normEj(linea);
    // agua (litros)
    const mAgua = nlinea.match(/agua.*?([\d.]+)\s*l/) || nlinea.match(/([\d.]+)\s*l.*agua/);
    if(nlinea.includes('agua') && mAgua){ res.agua += parseFloat(mAgua[1]); res.lineas.push(`💧 ${linea}`); return; }
    // gramos
    const mG = nlinea.match(/([\d.]+)\s*g/);
    // unidades (ej "2 huevos", "1.5 scoops")
    const mU = nlinea.match(/([\d.]+)\s*(huevo|huevos|scoop|scoops)/);
    // encontrar alimento por match mas largo
    let found=null, key='';
    for(const k of Object.keys(ALIMENTOS)){ if(nlinea.includes(k) && k.length>key.length){ key=k; found=ALIMENTOS[k]; } }
    if(!found){ res.desconocidos.push(linea); res.lineas.push(`❓ ${linea}`); return; }
    let cal,pr,ca,gr;
    const keyU = mU ? normEj(mU[2]).replace(/s$/,'') : null;
    if(mU && (keyU==='huevo'||keyU==='scoop')){
      const n = parseFloat(mU[1]);
      const base = keyU==='huevo' ? ALIMENTOS['huevo'] : ALIMENTOS['scoop'];
      cal=base[0]*n; pr=base[1]*n; ca=base[2]*n; gr=base[3]*n;
    } else if(mG){
      const g = parseFloat(mG[1])/100;
      cal=found[0]*g; pr=found[1]*g; ca=found[2]*g; gr=found[3]*g;
    } else {
      res.desconocidos.push(linea); res.lineas.push(`❓ ${linea} (sin cantidad)`); return;
    }
    res.cal+=cal; res.prot+=pr; res.carb+=ca; res.gra+=gr;
    res.lineas.push(`✓ ${linea} → ${Math.round(cal)}kcal ${Math.round(pr)}g prot`);
  });
  return res;
}

// ---- PLATOS FRECUENTES (aprendidos del historial de comidas) ----
// agrupa comidas similares por nombre base (sin numeros/gramos), calcula macros por gramo de referencia
function normPlato(texto){
  return texto.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[\d.]+\s*(g|ml|l|kg|lb)\b/g,'') // quita cantidades
    .replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
}
function platosFrecuentes(){
  const grupos = {};
  state.comidas.forEach(c => {
    if(!c.comida || !c.calorias) return;
    const key = normPlato(c.comida);
    if(!key || key.length<4) return;
    // gramos de referencia: primer numero+g del texto original
    const mG = c.comida.match(/(\d+)\s*g/i);
    const gramosRef = mG ? parseInt(mG[1]) : null;
    if(!grupos[key]) grupos[key] = {nombre:c.comida, count:0, muestras:[]};
    grupos[key].count++;
    grupos[key].muestras.push({
      cal:Number(c.calorias)||0, prot:Number(c.proteina)||0,
      carb:Number(c.carbos)||0, gra:Number(c.grasas)||0,
      gramosRef, nombreOriginal:c.comida
    });
  });
  // top platos por frecuencia, con macros por gramo (promedio de muestras que sí tienen gramosRef)
  return Object.values(grupos)
    .filter(g=>g.count>=2) // solo platos repetidos 2+
    .map(g=>{
      const conGramos = g.muestras.filter(m=>m.gramosRef);
      let porGramo = null;
      if(conGramos.length){
        const avgCal = conGramos.reduce((s,m)=>s+m.cal/m.gramosRef,0)/conGramos.length;
        const avgProt = conGramos.reduce((s,m)=>s+m.prot/m.gramosRef,0)/conGramos.length;
        const avgCarb = conGramos.reduce((s,m)=>s+m.carb/m.gramosRef,0)/conGramos.length;
        const avgGra = conGramos.reduce((s,m)=>s+m.gra/m.gramosRef,0)/conGramos.length;
        porGramo = {cal:avgCal, prot:avgProt, carb:avgCarb, gra:avgGra};
      }
      const ultima = g.muestras[g.muestras.length-1];
      return {
        nombreBase: key_display(g.nombre),
        count: g.count,
        porGramo,
        gramosDefault: ultima.gramosRef || 100,
        macrosFijos: {cal:ultima.cal, prot:ultima.prot, carb:ultima.carb, gra:ultima.gra}
      };
    })
    .sort((a,b)=>b.count-a.count)
    .slice(0,12);
}
function key_display(nombreOriginal){
  // limpia el nombre para mostrar (quita numeros de gramos especificos)
  return nombreOriginal.replace(/\d+\s*g\b/gi,'').replace(/\s+/g,' ').trim();
}

// tarjeta de ritmo objetivo: donde deberia estar hoy vs peso real
// checklist diario de 7 habitos — auto (calorias/proteina/cardio) + manual (entreno/sueno/pasos/suplementos)
function checklistDiario(){
  const hoy = todayStr();
  const h = state.habitos.find(x=>x.fecha===hoy) || {};
  // datos del dia para los automaticos
  const comidasHoy = state.comidas.filter(c=>c.fecha===hoy);
  const calHoy = comidasHoy.reduce((s,c)=>s+(Number(c.calorias)||0),0);
  const protHoy = comidasHoy.reduce((s,c)=>s+(Number(c.proteina)||0),0);
  const ejerHoy = state.ejercicios.filter(e=>e.fecha===hoy);
  const techo = NUTRICION_META.calMax;
  // cardio: hay registro de cardio hoy con >15min (buscamos en notas "min")
  const cardioHoy = ejerHoy.find(e=>esCardio(e.ejercicio));
  // AUTO checks
  const cCal = calHoy > 0 && calHoy <= techo;
  const cProt = protHoy >= NUTRICION_META.protMin;
  const cCardio = !!cardioHoy; // registro de cardio = hecho (zona 2 >15min)
  // MANUAL checks
  const cEntreno = !!h.entreno;
  const cSueno = !!h.sueno;
  const cPasos = !!h.pasos;
  const cSupl = !!h.suplementos;

  const items = [
    {k:'cal', auto:true, on:cCal, txt:`Calorías ${fmt(calHoy,0)}/${techo}`, ic:'🔥'},
    {k:'prot', auto:true, on:cProt, txt:`Proteína ${fmt(protHoy,0)}/${NUTRICION_META.protMin}g`, ic:'🍗'},
    {k:'entreno', auto:false, on:cEntreno, txt:'Fuerza con intensidad', ic:'💪'},
    {k:'sueno', auto:false, on:cSueno, txt:'Dormir 7.5-8h', ic:'😴'},
    {k:'pasos', auto:false, on:cPasos, txt:'8,000-10,000 pasos', ic:'👟'},
    {k:'cardio', auto:true, on:cCardio, txt:'Cardio zona 2 (>15min)', ic:'🏃'},
    {k:'supl', auto:false, on:cSupl, txt:'Creatina + suplementos', ic:'💊'},
  ];
  const logrados = items.filter(i=>i.on).length;
  let veredicto = logrados>=6?'🔥 Día fuerte':(logrados>=4?'💪 Vas bien, aprieta más':'🎯 Aún puedes ganarlo');
  let vcls = logrados>=6?'ok':(logrados>=4?'ambar':'rojo');

  let html = `<div class="check-card">
    <div class="check-head"><span>✅ Hitos de hoy</span><span class="check-score ${vcls}">${logrados}/7 · ${veredicto}</span></div>`;
  items.forEach(i=>{
    const clickable = !i.auto;
    html += `<div class="check-item ${i.on?'done':''}" ${clickable?`onclick="toggleHabito('${i.k}', event)" style="cursor:pointer"`:''}>
      <span class="check-box ${i.on?'on':''}">${i.on?'✓':''}</span>
      <span class="check-ic">${i.ic}</span>
      <span class="check-txt">${i.txt}</span>
      ${i.auto?'<span class="check-auto">auto</span>':'<span class="check-tap">tocar</span>'}
    </div>`;
  });
  html += `</div>`;
  return html;
}
function scoreChecklistHoy(){
  const hoy = todayStr();
  const h = state.habitos.find(x=>x.fecha===hoy) || {};
  const comidasHoy = state.comidas.filter(c=>c.fecha===hoy);
  const calHoy = comidasHoy.reduce((s,c)=>s+(Number(c.calorias)||0),0);
  const protHoy = comidasHoy.reduce((s,c)=>s+(Number(c.proteina)||0),0);
  const ejerHoy = state.ejercicios.filter(e=>e.fecha===hoy);
  const cardioHoy = ejerHoy.find(e=>esCardio(e.ejercicio));
  return [calHoy>0 && calHoy<=NUTRICION_META.calMax, protHoy>=NUTRICION_META.protMin, !!h.entreno, !!h.sueno, !!h.pasos, !!cardioHoy, !!h.suplementos]
    .filter(Boolean).length;

function crearParticulasSSJ(x, y, colores, count, spread=140, riseMax=260){
  const paleta = Array.isArray(colores) ? colores : [colores];
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'ssj-particle '+paleta[Math.floor(Math.random()*paleta.length)];
    const size = Math.random()*7+4;
    p.style.width = size+'px'; p.style.height = (size*1.6)+'px';
    p.style.left = (x-size/2)+'px'; p.style.top = (y-size/2)+'px';
    p.style.setProperty('--tx', (Math.random()*spread*2-spread)+'px');
    p.style.setProperty('--ty', (-(Math.random()*riseMax+80))+'px');
    p.style.setProperty('--dur', (0.7+Math.random()*0.9)+'s');
    document.body.appendChild(p);
    requestAnimationFrame(()=>p.classList.add('rise'));
    setTimeout(()=>p.remove(), 1700);
  }
}
// Escalera de transformaciones segun hitos del checklist diario (0-7)
const SSJ_TIERS = {
  ssj1: {rank:1, min:4, caption:'🔥 SUPER SAIYAN — 4/7',        colores:['ssj1'],          count:20, vibraMs:300},
  ssj2: {rank:2, min:5, caption:'⚡ SUPER SAIYAN 2 — 5/7',       colores:['ssj2'],          count:28, vibraMs:400},
  ssj4: {rank:3, min:6, caption:'💥 SUPER SAIYAN 4 — 6/7',       colores:['ssj4','ssj4b'],  count:32, vibraMs:500},
  ssjb: {rank:4, min:7, caption:'💎 SUPER SAIYAN BLUE — 7/7',    colores:['ssjb'],          count:36, vibraMs:600},
};
function tierDeScore(score){
  if(score>=7) return 'ssjb';
  if(score>=6) return 'ssj4';
  if(score>=5) return 'ssj2';
  if(score>=4) return 'ssj1';
  return null;
}
function saiyanTransform(tier){
  const cfg = SSJ_TIERS[tier];
  if(!cfg) return;
  // Vibracion visual de toda la pantalla + haptic real (Android/Chrome; iOS Safari la ignora sin romper nada)
  document.documentElement.classList.add('ssj-vibrate');
  setTimeout(()=>document.documentElement.classList.remove('ssj-vibrate'), cfg.vibraMs);
  if(navigator.vibrate){
    const patron = tier==='ssjb' ? [60,40,60,40,120] : tier==='ssj4' ? [50,30,50,30,90] : [40,30,70];
    navigator.vibrate(patron);
  }

  const flash = document.createElement('div');
  flash.className = 'ssj-flash '+tier+' show';
  document.body.appendChild(flash);
  setTimeout(()=>flash.remove(), 800);

  const caption = document.createElement('div');
  caption.className = 'ssj-caption '+tier+' show';
  caption.textContent = cfg.caption;
  document.body.appendChild(caption);
  setTimeout(()=>caption.remove(), 1250);

  const card = document.querySelector('.check-card');
  if(card){
    card.classList.add('ssj-charge', tier);
    setTimeout(()=>card.classList.remove('ssj-charge', tier), 550);
    const r = card.getBoundingClientRect();
    crearParticulasSSJ(r.left+r.width/2, r.top+18, cfg.colores, cfg.count, 160, 320);
  } else {
    crearParticulasSSJ(window.innerWidth/2, window.innerHeight*0.7, cfg.colores, cfg.count, 160, 320);
  }
}
async function toggleHabito(campo, ev){
  const map = {entreno:'entreno', sueno:'sueno', pasos:'pasos', supl:'suplementos'};
  const col = map[campo];
  const hoy = todayStr();
  const h = state.habitos.find(x=>x.fecha===hoy) || {};
  const nuevo = !h[col];
  let origen = null;
  if(ev && ev.currentTarget){
    const r = ev.currentTarget.getBoundingClientRect();
    origen = {x:r.left+r.width/2, y:r.top+r.height/2};
  }
  const scoreAntes = scoreChecklistHoy();
  const {error} = await sb.from('fenix_habitos').upsert({fecha:hoy, [col]:nuevo}, {onConflict:'fecha'});
  if(error){ showToast('Error: '+error.message); return; }
  await loadAll(); renderDashboard();
  if(nuevo && origen) crearParticulasSSJ(origen.x, origen.y, 'ssj1', 6, 40, 90);
  const scoreDespues = scoreChecklistHoy();
  const tierAntes = tierDeScore(scoreAntes), tierDespues = tierDeScore(scoreDespues);
  const rankAntes = tierAntes ? SSJ_TIERS[tierAntes].rank : 0;
  const rankDespues = tierDespues ? SSJ_TIERS[tierDespues].rank : 0;
  if(rankDespues > rankAntes) saiyanTransform(tierDespues);
}


function ritmoObjetivo(){
  const START_PESO = 232;
  const RETO_START_R = new Date('2026-06-30T00:00:00'); // Día 1 oficial del reto (lunes)
  const hoy = new Date();
  const diasDesdeInicio = Math.floor((hoy - RETO_START_R)/86400000) + 1; // dia 1,2,3...
  const semanas = Math.max(0, (diasDesdeInicio-1)/7); // fraccion de semanas transcurridas, para el "deberias ir" continuo
  const pesoIdeal = START_PESO * Math.pow(1-RITMO_SEMANAL, semanas);
  // peso actual real
  const diasP = state.dias.filter(d=>d.peso!==null).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const pesoBascula = diasP.length ? diasP[diasP.length-1].peso : START_PESO;
  // La bascula de un dia es ruido (agua, sal, glucogeno). Se decide con la media movil.
  const fechaMenos = (n)=>{ const d=new Date(hoy.getTime()-n*86400000); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  const promedio = (arr)=> arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
  const ventana = (desde, hasta)=> promedio(diasP.filter(d=>d.fecha>desde && d.fecha<=hasta).map(d=>d.peso));
  const media7 = ventana(fechaMenos(7), fechaMenos(0)) ?? pesoBascula;
  const media7prev = ventana(fechaMenos(14), fechaMenos(7));
  // Ritmo real: media contra media. Positivo = bajando.
  const ritmoReal = media7prev ? ((media7prev - media7)/media7prev)*100 : null;
  const pesoReal = media7;
  const diff = pesoReal - pesoIdeal;
  const enRitmo = diff <= 0.5;
  // Ir rapido solo es un problema si de verdad se esta perdiendo masa magra (medido), no por el % solo.
  const medOrd = state.medidas.filter(m=>m.masa_magra!=null).slice().sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const magraUlt = medOrd.length ? medOrd[medOrd.length-1].masa_magra : null;
  const magraPrev = medOrd.length>1 ? medOrd[medOrd.length-2].masa_magra : null;
  const deltaMagra = (magraUlt!=null && magraPrev!=null) ? (magraUlt-magraPrev) : null;
  const perdiendoMusculo = deltaMagra!==null && deltaMagra < -0.3; // umbral de ruido de medicion
  let ritmoMsg = '', ritmoCls = '';
  if(ritmoReal === null){ ritmoMsg = 'Ritmo real: faltan 14 días de pesaje para calcularlo'; ritmoCls='off'; }
  else if(ritmoReal < 0.15){ ritmoMsg = `Ritmo real ${fmt(ritmoReal,2)}%/sem — aprieta un poco: si sigue así 2 semanas, baja 100 kcal/día`; ritmoCls='off'; }
  else if(ritmoReal <= 1.30){ ritmoMsg = `🔥 Ritmo real ${fmt(ritmoReal,2)}%/sem — justo en la zona ideal`; ritmoCls='ok'; }
  else if(perdiendoMusculo){ ritmoMsg = `⚠️ Ritmo real ${fmt(ritmoReal,2)}%/sem y tu masa magra bajó ${fmt(Math.abs(deltaMagra))} lb desde la última medición — ahí sí toca subir 100-150 kcal/día`; ritmoCls='off'; }
  else if(deltaMagra!==null){ ritmoMsg = `🚀 Ritmo real ${fmt(ritmoReal,2)}%/sem y tu masa magra se mantiene — vas rápido sin pagarlo en músculo, ¡sigue así!`; ritmoCls='ok'; }
  else { ritmoMsg = `🚀 Ritmo real ${fmt(ritmoReal,2)}%/sem — vas rápido. Toma medidas pronto para confirmar que no es músculo`; ritmoCls='off'; }
  // semana natural: dias 1-7 = semana 1, 8-14 = semana 2, 15-21 = semana 3...
  const semanaActual = Math.max(1, Math.ceil(diasDesdeInicio/7));
  const objSemana = START_PESO * Math.pow(1-RITMO_SEMANAL, semanaActual);
  return `<div class="ritmo-card">
    <div class="ritmo-top">
      <span class="ritmo-title">🎯 Meta: ${META_LB} lb (día 60)</span>
      <span class="ritmo-pace">0.9%/sem · ~0.30 lb/día</span>
    </div>
    <div class="ritmo-row">
      <div class="ritmo-box"><div class="ritmo-lbl">Deberías ir</div><div class="ritmo-val">${fmt(pesoIdeal)} lb</div></div>
      <div class="ritmo-box"><div class="ritmo-lbl">Vas (media 7d)</div><div class="ritmo-val" style="color:${enRitmo?'var(--green)':'var(--red)'}">${fmt(pesoReal)} lb</div><div class="ritmo-lbl" style="opacity:.6">báscula hoy ${fmt(pesoBascula)}</div></div>
      <div class="ritmo-box"><div class="ritmo-lbl">Meta sem ${semanaActual}</div><div class="ritmo-val">${fmt(objSemana)} lb</div></div>
    </div>
    <div class="ritmo-msg ${enRitmo?'ok':'off'}">${enRitmo?'✓ En ritmo o adelantado':`⚠️ ${fmt(Math.abs(diff))} lb por encima del ritmo — aprieta déficit y agua`}</div>
    <div class="ritmo-msg ${ritmoCls}" style="margin-top:6px">${ritmoMsg}</div>
  </div>`;
}

function headerRecomendaciones(){
  const tips = [];
  // agua
  const aguas = state.dias.filter(d=>d.agua!==null).map(d=>d.agua);
  const aguaProm = aguas.length ? aguas.reduce((a,b)=>a+b,0)/aguas.length : null;
  if(aguaProm!==null && aguaProm < 3.5) tips.push({ic:'💧',t:`Agua en ${fmt(aguaProm)}L promedio vs 4L objetivo — tu déficit crónico. Es el único KPI que falla por ejecución, no por dato.`});
  // recomposicion
  const meds = state.medidas.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(meds.length>1){
    const dG = meds[meds.length-1].grasa_corporal - meds[0].grasa_corporal;
    if(dG < 0) tips.push({ic:'🔥',t:`Grasa bajó ${fmt(Math.abs(dG))} pts y masa magra subió. Estás recomponiendo — no mires solo la báscula, el peso plano no es estancamiento.`});
  }
  // proteina
  const prots = state.dias.filter(d=>d.proteina!==null).map(d=>d.proteina);
  const protProm = prots.length ? prots.reduce((a,b)=>a+b,0)/prots.length : null;
  if(protProm!==null && protProm > 230) tips.push({ic:'⚠️',t:`Proteína promedio ${fmt(protProm,0)}g — sobre el techo util de 230g. El exceso no construye más músculo, es gasto sin retorno.`});

  if(!tips.length) return '';
  return `<div class="reco-header">
    <div class="reco-title">🎯 Recomendaciones para hoy</div>
    ${tips.map(t=>`<div class="reco-item"><span>${t.ic}</span><span>${t.t}</span></div>`).join('')}
  </div>`;
}

function renderEntrenamientos(){
  const byDate = {};
  state.ejercicios.forEach(e => {
    if(!byDate[e.fecha]) byDate[e.fecha] = [];
    byDate[e.fecha].push(e);
  });
  const allDates = new Set([...Object.keys(byDate), ...state.dias.map(d=>d.fecha)]);
  const dates = [...allDates].sort().reverse();

  function prevPeso(nombre, fecha){
    // reconoce el mismo ejercicio aunque el nombre exacto cambie entre Mes1 y Mes2
    // (ej "Fly En Maquina" hoy = "Fly Maquina" en Mes1), usando los alias de MES2.hist
    const aliases = new Set([normEj(nombre)]);
    const info = diaInfoDe(nombre);
    if(info){
      if(info.n) aliases.add(normEj(info.n));
      if(info.hist) info.hist.forEach(h=>aliases.add(normEj(h)));
    }
    const hist = state.ejercicios
      .filter(e => aliases.has(normEj(e.ejercicio)) && e.peso && e.fecha < fecha)
      .sort((a,b)=>b.fecha.localeCompare(a.fecha));
    return hist.length ? hist[0] : null;
  }

  let html = `<div class="section-title">Entrenamientos</div>`;
  dates.forEach(fecha => {
    const diaLog = state.dias.find(d => d.fecha === fecha);
    const items = byDate[fecha] || [];
    // separar pesas de cardio/descanso
    const pesas = items.filter(e => !esCardio(e.ejercicio));
    const cardio = items.filter(e => esCardio(e.ejercicio));
    // ordenar pesas por indice Renfit (los que no matchean van al final)
    pesas.sort((a,b)=>{
      const ra=diaInfoDe(a.ejercicio), rb=diaInfoDe(b.ejercicio);
      if(ra&&rb) return ra.o-rb.o;
      if(ra) return -1; if(rb) return 1; return 0;
    });
    const diaReto = pesas.length && diaInfoDe(pesas[0].ejercicio) ? diaInfoDe(pesas[0].ejercicio).d : null;

    html += `<div class="entry"><div class="entry-date">${fecha}`;
    if(!pesas.length) html += `<span class="day-badge">DESCANSO / CARDIO</span>`;
    else if(diaReto) html += `<span class="day-badge">DÍA ${diaReto}</span>`;
    html += `</div>`;

    pesas.forEach(e => {
      const rf = diaInfoDe(e.ejercicio);
      let prog = '';
      if(e.peso){
        const prev = prevPeso(e.ejercicio, fecha);
        if(prev){
          const diff = e.peso - prev.peso;
          const pct = ((diff / prev.peso) * 100);
          let cls = diff>0?'up':(diff<0?'down':'same');
          let arrow = diff>0?'▲':(diff<0?'▼':'=');
          prog = `<span class="prog ${cls}">${arrow} ${diff>0?'+':''}${fmt(diff)} lb (${pct>0?'+':''}${fmt(pct,0)}%)</span>`;
        } else prog = `<span class="prog new">nuevo</span>`;
      }
      // rango objetivo vs real
      let objetivo = '';
      if(rf){
        const cumple = repEnRango(e.reps, rf.reps);
        objetivo = `<span class="obj ${cumple?'ok':'bajo'}">obj: ${rf.reps} reps</span>`;
      }
      const num = rf ? `<span class="ex-num">#${rf.o}</span>` : '';
      html += `<div class="ex-row">
        <div class="ex-head">
          <span class="ex-name">${num}${e.ejercicio}</span>
          <span class="ex-load">${e.series}×${e.reps}${e.peso?' · '+fmt(e.peso)+' lb':''}</span>
        </div>
        <div class="ex-tags">${prog}${objetivo}</div>
        ${e.notas?`<div class="ex-note">${e.notas}</div>`:''}
      </div>`;
    });

    if(cardio.length){
      html += `<div class="cardio-block"><div class="cardio-title">🏃 Cardio / Actividad</div>`;
      cardio.forEach(c => {
        html += `<div class="ex-note" style="color:var(--text)"><b>${c.ejercicio}</b>${c.notas?' — '+c.notas:''}</div>`;
      });
      html += `</div>`;
    }

    if(diaLog && diaLog.notas){
      html += `<div class="entry-body" style="margin-top:10px;color:var(--sub);">${diaLog.notas}</div>`;
    }
    if(!pesas.length && !cardio.length && !(diaLog&&diaLog.notas)){
      html += `<div class="macro">Sin actividad registrada</div>`;
    }
    html += `</div>`;
  });
  document.getElementById('app').innerHTML = html || '<div class="loading">Sin entrenamientos registrados</div>';
}

// ¿las reps reales caen dentro del rango objetivo?
function repEnRango(real, rango){
  const r = parseInt(real);
  if(isNaN(r)) return true;
  if(rango.includes('-')){
    const [lo,hi] = rango.split('-').map(x=>parseInt(x));
    return r >= lo;
  }
  return r >= parseInt(rango);
}

      </div>`;
    if(faltan.length){
      html += `<div class="faltan">⚠️ Falta registrar: ${faltan.join(', ')}</div>`;
    }
    items.forEach(c => {
      html += `<div class="entry-body"><b>${c.momento}:</b> ${c.comida}</div>`;
      html += `<div class="macro-row">
        <span class="macro">Cal: <b>${fmt(c.calorias,0)}</b></span>

        ${c.fibra!==null&&c.fibra!==undefined?`<span class="macro">Fibra: <b>${fmt(c.fibra,0)}g</b></span>`:''}
      </div>`;
    });
    html += `</div>`;
  });
  document.getElementById('app').innerHTML = html || '<div class="loading">Sin comidas registradas</div>';

// Prioridad por impacto estetico real para la foto del dia 60.
// Editable: dime si quieres cambiar las estrellas de algun grupo.
const PRIORIDAD_MUSCULAR = {
  'Hombros':        {estrellas:5, series:[14,20], nota:'Deltoide lateral = ancho visual. El músculo de mayor retorno estético'},
  'Espalda':        {estrellas:5, series:[14,20], nota:'Dorsales = efecto V, cintura se ve más pequeña por contraste'},

  'Hombro Post.':   {estrellas:4, series:[6,10],  nota:'Postura y volumen 3D del hombro, muy descuidado en general'},
  'Biceps':         {estrellas:4, series:[8,14],  nota:'Alto impacto visual por unidad de esfuerzo'},
  'Triceps':        {estrellas:4, series:[8,14],  nota:'2/3 del volumen del brazo — más importante que el bíceps para grosor'},
  'Gluteos':        {estrellas:3, series:[8,14],  nota:'Base de fuerza y silueta lateral'},
  'Pierna':         {estrellas:3, series:[8,14],  nota:'Cuádriceps: proporción y salud metabólica'},
  'Isquios':        {estrellas:3, series:[6,10],  nota:'Equilibrio con cuádriceps, protege rodilla'},
  'Abductores':     {estrellas:2, series:[3,6],   nota:'Estabilidad de cadera, poco impacto visual'},
  'Adductores':     {estrellas:2, series:[3,6],   nota:'Complemento del abductor'},
  'Pantorrillas':   {estrellas:2, series:[6,12],  nota:'Bajo retorno estético relativo, muy genético'},
};
// mapea un nombre de ejercicio a su grupo muscular (busca en MES2 y luego en RENFIT)
function grupoDe(nombreEj){
  const n = normEj(nombreEj);
  const m2 = MES2.find(x=>normEj(x.n)===n || (x.hist||[]).some(h=>normEj(h)===n));
  if(m2) return m2.g;
  const info = RENFIT[n];
  if(info) return info.g;
  return null;
}
function volumenSemanal(){
  const hoy = new Date();
  const hace7 = new Date(hoy.getTime() - 7*86400000);
  const f7 = hace7.getFullYear()+'-'+String(hace7.getMonth()+1).padStart(2,'0')+'-'+String(hace7.getDate()).padStart(2,'0');
  const conteo = {};
  state.ejercicios.filter(e=>e.fecha>=f7 && e.series && !esCardio(e.ejercicio)).forEach(e=>{
    const g = grupoDe(e.ejercicio);
    if(!g) return;
    if(!conteo[g]) conteo[g] = {series:0, fechas:new Set()};
    conteo[g].series += (Number(e.series)||0);
    conteo[g].fechas.add(e.fecha);
  });
  return conteo;
}
function iconMusculoSVG(grupo){
  const P = {'Hombros':'hombros','Hombro Post.':'hombros','Espalda':'torso','Pecho':'torso',
    'Biceps':'brazo','Triceps':'brazo','Gluteos':'gluteos','Pierna':'muslo','Isquios':'muslo',
    'Abductores':'cadera','Adductores':'cadera','Pantorrillas':'pantorrilla'};

function renderPrioridadMuscular(){
  const conteo = volumenSemanal();
  const filas = Object.entries(PRIORIDAD_MUSCULAR)
    .sort((a,b)=>b[1].estrellas-a[1].estrellas);
  let deficits = [];
  let unaVez = [];
  let html = `<div class="section-title">Índice de Prioridad Muscular</div>
    <div class="prio-intro">Series completadas en los últimos 7 días vs rango objetivo según impacto estético.</div>
    <div class="prio-legend">
      <span class="prio-legend-item"><span class="prio-dot" style="background:var(--red)"></span>Falta volumen</span>
      <span class="prio-legend-item"><span class="prio-dot" style="background:var(--green)"></span>En el punto justo</span>
      <span class="prio-legend-item"><span class="prio-dot" style="background:#ffb400"></span>Ya es de más</span>
    </div>`;
  filas.forEach(([grupo, cfg])=>{
    const hechas = conteo[grupo] ? conteo[grupo].series : 0;
    const frec = conteo[grupo] ? conteo[grupo].fechas.size : 0;
    const [minS, maxS] = cfg.series;
    let estado, cls;
    if(hechas < minS){ estado=`faltan ${minS-hechas}`; cls='bajo'; if(cfg.estrellas>=4) deficits.push({grupo, faltan:minS-hechas, estrellas:cfg.estrellas}); }
    else if(hechas > maxS){ estado='sobre rango'; cls='sobre'; }
    else { estado='en rango'; cls='ok'; }
    if(frec===1 && cfg.estrellas>=4) unaVez.push(grupo);
    const pct = Math.min((hechas/maxS)*100, 100);
    html += `<div class="prio-row">
      <div class="prio-top">
        <span class="prio-name" style="display:flex;align-items:center;gap:8px">${iconMusculoSVG(grupo)}<span>${grupo} <span class="prio-stars">${'★'.repeat(cfg.estrellas)}${'☆'.repeat(5-cfg.estrellas)}</span></span></span>
        <span class="prio-vol ${cls}">${hechas}/${minS}-${maxS} series · ${estado}${frec?` <span style="padding:1px 6px;border-radius:4px;font-size:.85em;background:${frec>=2?'rgba(0,200,120,.15)':'rgba(255,80,80,.18)'};color:${frec>=2?'var(--green)':'var(--red)'}">${frec}x/sem</span>`:''}</span>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${cls==='ok'?'var(--green)':cls==='bajo'?'var(--red)':'#ffb400'}"></div><div class="bar-min-marker" style="left:${(minS/maxS)*100}%"></div></div>
      <div class="prio-nota">${cfg.nota}</div>
    </div>`;
  });
  // recomendacion accionable
  if(deficits.length){
    deficits.sort((a,b)=>b.estrellas-a.estrellas || b.faltan-a.faltan);
    const top = deficits.slice(0,2);
    html += `<div class="prio-reco"><b>🎯 Mayor retorno esta semana:</b><br>`;
    html += top.map(d=>`Añade <b>${d.faltan} series de ${d.grupo}</b> — ${'★'.repeat(d.estrellas)} de impacto estético`).join('<br>');
    html += `</div>`;
  } else {
    html += `<div class="prio-reco ok"><b>✓ Volumen equilibrado</b><br>Todos los grupos de alta prioridad están en rango esta semana.</div>`;
  }
  if(unaVez.length){
    html += `<div class="prio-reco"><b>🔁 Frecuencia baja:</b><br>${unaVez.join(', ')} solo ${unaVez.length>1?'aparecen':'aparece'} 1 día esta semana. En déficit conviene repartir el mismo volumen en 2 sesiones — mismas series, mejor retención.</div>`;
  }
  return html;
}

function renderProgreso(){
  let html = renderPrioridadMuscular();
  html += `<div class="section-title">Medidas Corporales (in / lb)</div>`;
  if(!state.medidas.length){
    html += '<div class="loading">Sin medidas registradas</div>';
  } else {
    state.medidas.forEach((m,i) => {
      const prev = state.medidas[i-1];
      const delta = (key) => {
        if(!prev || prev[key] === null || m[key] === null) return '';
        const d = m[key] - prev[key];
        if(Math.abs(d) < 0.05) return '';
        const color = d < 0 ? 'green' : 'red';
        return ` <span class="macro" style="color:var(--${color})">${d>0?'+':''}${fmt(d)}</span>`;
      };
      html += `<div class="entry">
        <div class="entry-date">${m.fecha}</div>
        <div class="macro-row">
          <span class="macro">Peso: <b>${fmt(m.peso)} lb</b>${delta('peso')}</span>
          <span class="macro">Grasa: <b>${fmt(m.grasa_corporal)}%</b>${delta('grasa_corporal')}</span>
          <span class="macro">Masa Magra: <b>${fmt(m.masa_magra)} lb</b>${delta('masa_magra')}</span>
        </div>
        <div class="macro-row">
          <span class="macro">Cintura: <b>${fmt(m.cintura)}"</b>${delta('cintura')}</span>
          <span class="macro">Pecho: <b>${fmt(m.pecho)}"</b>${delta('pecho')}</span>
          <span class="macro">Glúteos: <b>${fmt(m.gluteos)}"</b>${delta('gluteos')}</span>
        </div>
        <div class="macro-row">
          <span class="macro">Bíceps I/D: <b>${fmt(m.biceps_izq)}"/${fmt(m.biceps_der)}"</b></span>
          <span class="macro">Muslo I/D: <b>${fmt(m.muslo_izq)}"/${fmt(m.muslo_der)}"</b></span>
        </div>
        ${m.notas ? `<div class="macro" style="margin-top:6px;">${m.notas}</div>` : ''}
      </div>`;
    });
  }
  document.getElementById('app').innerHTML = html;
}

// renderiza chips de platos que comes seguido
function renderPlatosFrecuentes(){
  const cont = document.getElementById('com-frecuentes');
  const platos = platosFrecuentes();
  if(!platos.length){ cont.innerHTML=''; return; }
  let html = `<div class="frec-label">Comes seguido:</div><div class="frec-chips">`;
  platos.forEach((p,i) => {
    html += `<span class="frec-chip" onclick='seleccionarPlato(${i})'>${p.nombreBase} <b>${p.gramosDefault}g</b></span>`;
  });
  html += `</div>`;
  window._platosFrecCache = platos; // cache para seleccionarPlato
  cont.innerHTML = html;
}

function seleccionarPlato(i){
  const p = window._platosFrecCache[i];
  if(p.porGramo){
    // editable: mete el texto con gramos, el usuario puede tocar Calcular con otro gramaje si cambia el numero
    document.getElementById('com-comida').value = `${p.nombreBase.trim()} ${p.gramosDefault}g`;
  } else {
    document.getElementById('com-comida').value = p.nombreBase.trim();
    document.getElementById('com-cal').value = Math.round(p.macrosFijos.cal);
    document.getElementById('com-prot').value = Math.round(p.macrosFijos.prot);
    document.getElementById('com-carb').value = Math.round(p.macrosFijos.carb);
    document.getElementById('com-gra').value = Math.round(p.macrosFijos.gra);
    showToast('Plato cargado — ajusta gramos si cambió');
    return;
  }
  // autollenar macros con el gramaje default usando porGramo
  document.getElementById('com-cal').value = Math.round(p.porGramo.cal * p.gramosDefault);
  document.getElementById('com-prot').value = Math.round(p.porGramo.prot * p.gramosDefault);
  document.getElementById('com-carb').value = Math.round(p.porGramo.carb * p.gramosDefault);
  document.getElementById('com-gra').value = Math.round(p.porGramo.gra * p.gramosDefault);
  showToast(`${p.nombreBase.trim()} cargado — cambia el número de gramos y toca Calcular si comiste otra cantidad`);
}

// mapea fecha -> dia de reto segun dia de semana
function diaRetoDeFecha(fechaStr){
  const d = new Date(fechaStr+'T12:00:00').getDay();
  return {0:6,1:1,2:2,3:3,5:4,6:5}[d] || null;
}

// lista fija de ejercicios del dia, en orden, con series precargadas
function renderListaDia(){
  const fecha = document.getElementById('ej-fecha').value;
  const diaReto = diaRetoDeFecha(fecha);
  const cont = document.getElementById('ej-dia-lista');
  if(!diaReto){
    cont.innerHTML = `<div class="dia-descanso">Día de descanso activo — no hay rutina de pesas.<br>Registra cardio/actividad abajo:</div>
      <label>Actividad</label><input type="text" id="ej-libre-nombre" placeholder="ej: Caminata playa, Boxeo 5min">
      <label>Notas</label><input type="text" id="ej-libre-notas" placeholder="tiempo, distancia, bpm">
      <button class="save-btn" onclick="saveLibre()">Guardar actividad</button>`;
    return;
  }
  const ejs = ejerciciosDelDia(diaReto, fecha);
  const nombreDia = nombreDiaDe(fecha, diaReto);

  // ya registrados en esa fecha (para marcar check) - por nombre, funciona en Mes1 y Mes2
  const registradosHoy = state.ejercicios.filter(e=>e.fecha===fecha);

  let html = `<div class="lista-dia-head">${nombreDia}${esMes2(fecha)?' <span class="mes-badge">MES 2</span>':''}</div>`;
  ejs.forEach(ej => {
    const nombreCap = ej.nombre.replace(/\b\w/g,c=>c.toUpperCase());
    const ultimoReg = ultimoPesoDe(ej, fecha);
    const ult = ultimoReg ? ultimoReg.peso : null;
    const sug = ult?Math.round(ult*1.05*2)/2:null;
    const hecho = registradosHoy.some(e=>normEj(e.ejercicio)===normEj(ej.nombre));
    const nSets = parseInt(ej.series)||3;
    const repsObj = parseInt(ej.reps)||10;
    const prog = decisionProgresion(ej, ultimoReg);
    const pesoSugerido = prog.sug || sug;

    let setsHtml = '';
    for(let s=1; s<=nSets; s++){
      setsHtml += `<div class="set-row" data-set="${s}">
        <span class="set-num">${s}</span>
        <input type="number" class="set-peso" step="0.5" placeholder="${pesoSugerido||'lb'}">
        <input type="number" class="set-reps" value="${repsObj}">
        <span class="set-check">○</span>
      </div>`;
    }

    const RIR_OPS = [
      {v:0, l:'Al fallo', ic:'🔥'},
      {v:1, l:'Muy duro', ic:''},
      {v:2, l:'Ideal', ic:''},
      {v:3, l:'Fácil', ic:''},
      {v:4, l:'Muy fácil', ic:''},
    ];
    const rirHtml = `<div class="rir-wrap">
      <div class="rir-label">¿Cuántas reps te quedaban en la última serie?</div>
      <div class="rir-btns">
        ${RIR_OPS.map(o=>`<button type="button" class="rir-btn" data-rir="${o.v}" onclick="setRir(this)">
          <span class="rir-num">${o.ic||o.v}</span><span class="rir-word">${o.l}</span>
        </button>`).join('')}
      </div>
      <div class="rir-feedback"></div>
    </div>`;

    html += `<div class="lde ${hecho?'done':''}" data-o="${ej.o}" data-d="${ej.d}" data-nombre="${nombreCap}">
      <div class="lde-top" onclick="toggleExpand(this)" style="cursor:pointer">
        <span class="lde-name"><span class="ex-num">#${ej.o}</span>${nombreCap} ${hecho?'<span class="lde-check">✓</span>':''}</span>
        <span class="lde-arrow">▾</span>
      </div>
      <div class="lde-meta">${ej.series}×${ej.reps} obj · ⏱${ej.desc || descansoRenfit(ej.nombre)}${ult?` · últ: ${fmt(ult)}lb`:''}</div>
      <div class="prog-banner ${prog.cls}">${prog.accion==='sube'?'▲':prog.accion==='baja'?'▼':prog.accion==='nuevo'?'●':prog.accion==='reps'?'↻':'='} ${prog.txt}</div>
      <div class="sets-wrap">
        <div class="set-header"><span></span><span>LB</span><span>REPS</span><span></span></div>
        ${setsHtml}
        ${rirHtml}
        <div class="set-actions">
          <button class="set-add" onclick="addSet(this)">+ Serie</button>
          <button class="lde-save" onclick="saveEjLista(this)">Guardar todas</button>
        </div>
      </div>
    </div>`;
  });
  cont.innerHTML = html;
}

function toggleExpand(topEl){
  topEl.closest('.lde').classList.toggle('collapsed');
}

function addSet(btn){
  const wrap = btn.closest('.sets-wrap');
  const rows = wrap.querySelectorAll('.set-row');
  const n = rows.length + 1;
  const last = rows[rows.length-1];
  const lastReps = last.querySelector('.set-reps').value;
  const lastPeso = last.querySelector('.set-peso').value;
  const div = document.createElement('div');
  div.className = 'set-row';
  div.dataset.set = n;
  div.innerHTML = `<span class="set-num">${n}</span>
    <input type="number" class="set-peso" step="0.5" value="${lastPeso}">
    <input type="number" class="set-reps" value="${lastReps}">
    <span class="set-check">○</span>`;
  btn.parentElement.insertAdjacentElement('beforebegin', div);
}

const RIR_FEEDBACK = {
  0: {t:'⚠️ Cuidado — no entrenes siempre al fallo. Resérvalo para la última serie de aislamiento, no para los básicos pesados.', cls:'alerta'},
  1: {t:'Muy exigente. Válido en tus series finales, pero no en todas o acumulas fatiga sin más ganancia.', cls:'duro'},
  2: {t:'✓ Perfecto. Mantuviste 2 repeticiones en reserva — es la zona ideal para progresar sin quemarte.', cls:'ideal'},
  3: {t:'Cómodo. Buen margen de seguridad, pero si se repite es señal clara de que toca subir peso.', cls:'facil'},
  4: {t:'Muy fácil. El peso está flojo para este rango — la próxima sesión sube carga.', cls:'facil'},
};
function setRir(btn){
  const wrap = btn.closest('.rir-wrap');
  wrap.querySelectorAll('.rir-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const v = btn.dataset.rir;
  wrap.dataset.rir = v;
  const fb = wrap.querySelector('.rir-feedback');
  const info = RIR_FEEDBACK[v];
  if(fb && info){ fb.className = 'rir-feedback show '+info.cls; fb.textContent = info.t; }
}

async function saveEjLista(btn){
  const row = btn.closest('.lde');
  const fecha = document.getElementById('ej-fecha').value;
  const nombre = row.dataset.nombre;
  const setRows = row.querySelectorAll('.set-row');
  const rirWrap = row.querySelector('.rir-wrap');
  const rir = rirWrap && rirWrap.dataset.rir !== undefined ? parseInt(rirWrap.dataset.rir) : null;
  const sets = [];
  setRows.forEach(sr => {
    const peso = parseFloat(sr.querySelector('.set-peso').value);
    const reps = parseInt(sr.querySelector('.set-reps').value);
    if(peso && reps) sets.push({peso, reps});
  });
  if(!sets.length){ showToast('Completa al menos una serie'); return; }

  // agrupar series iguales (mismo peso+reps) en un solo registro tipo "4x10x50lb"
  // si varian, se guardan como registro unico con el peso/reps mas frecuente + nota del detalle
  const pesoModa = sets[0].peso, repsModa = sets[0].reps;
  const todasIguales = sets.every(s=>s.peso===pesoModa && s.reps===repsModa);
  let notaDetalle = null;
  if(!todasIguales){
    notaDetalle = sets.map((s,i)=>`S${i+1}:${s.reps}x${s.peso}lb`).join(' ');
  }
  const data = {
    fecha, ejercicio: nombre,
    series: sets.length,
    reps: todasIguales ? repsModa : sets[sets.length-1].reps,
    peso: todasIguales ? pesoModa : sets[sets.length-1].peso,
    rir: rir,
    notas: notaDetalle
  };
  const {error} = await sb.from('fenix_ejercicios').insert(data);
  if(error){ showToast('Error: '+error.message); return; }
  await loadAll();
  row.classList.add('done');
  setRows.forEach(sr=>sr.querySelector('.set-check').textContent='✓');
  showToast(`${nombre} guardado ✓ (${sets.length} series${rir!==null?', RIR '+rir:''})`);
}

async function saveLibre(){
  const nombre = document.getElementById('ej-libre-nombre').value.trim();
  const notas = document.getElementById('ej-libre-notas').value.trim();
  if(!nombre){ showToast('Falta la actividad'); return; }
  const {error} = await sb.from('fenix_ejercicios').insert({fecha:document.getElementById('ej-fecha').value, ejercicio:nombre, series:1, reps:null, peso:null, notas:notas||null});
  if(error){ showToast('Error: '+error.message); return; }
  document.getElementById('ej-libre-nombre').value='';
  document.getElementById('ej-libre-notas').value='';
  await loadAll(); showToast('Actividad guardada ✓');
}

// muestra en el form de comida que momentos faltan HOY
function actualizarFaltanHoy(){
  const hoy = todayStr();
  const hechos = new Set(state.comidas.filter(c=>c.fecha===hoy).map(c=>c.momento.toLowerCase()));
  const base = ['desayuno','almuerzo','cena'];
  const faltan = base.filter(m=>!hechos.has(m) && !(m==='almuerzo'&&hechos.has('comida')));
  const el = document.getElementById('com-faltan');
  if(!el) return;
  if(faltan.length){
    el.innerHTML = `Hoy falta: ${faltan.map(f=>`<span class="pill-falta" onclick="setMomento('${f}')">${f}</span>`).join(' ')}`;
  } else {
    el.innerHTML = `<span style="color:var(--green)">✓ Desayuno, almuerzo y cena registrados hoy</span>`;
  }
}
function setMomento(m){
  const sel = document.getElementById('com-momento');
  const cap = m.charAt(0).toUpperCase()+m.slice(1);
  for(const opt of sel.options){ if(opt.value.toLowerCase()===m){ sel.value=opt.value; break; } }
}

// calcula macros desde el texto de la comida y llena los campos
function calcularMacros(){
  const texto = document.getElementById('com-comida').value;
  if(!texto.trim()){ showToast('Escribe la comida primero'); return; }
  const r = parseComida(texto);
  document.getElementById('com-cal').value = Math.round(r.cal);
  document.getElementById('com-prot').value = Math.round(r.prot);
  document.getElementById('com-carb').value = Math.round(r.carb);
  document.getElementById('com-gra').value = Math.round(r.gra);
  let html = r.lineas.map(l=>`<div>${l}</div>`).join('');
  if(r.agua>0) html += `<div style="color:var(--orange);margin-top:4px">💧 ${r.agua}L de agua → guárdala en la pestaña "Día"</div>`;
  if(r.desconocidos.length) html += `<div style="color:#ffb400;margin-top:4px">⚠️ No reconocí: ${r.desconocidos.join(', ')} — mete sus macros a mano o ajusta</div>`;
  html += `<div class="desglose-total">Total: ${Math.round(r.cal)} kcal · ${Math.round(r.prot)}g prot · ${Math.round(r.carb)}g carb · ${Math.round(r.gra)}g grasa</div>`;
  document.getElementById('com-desglose').innerHTML = html;
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }

document.querySelectorAll('.mtab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.mtab').forEach(x=>x.classList.remove('active'));

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

async function saveCom(){
  const fecha = document.getElementById('com-fecha').value;
  const momento = document.getElementById('com-momento').value;
  const row = {
    fecha, momento,
    comida: document.getElementById('com-comida').value.trim(),
    calorias: parseFloat(document.getElementById('com-cal').value)||null,
    proteina: parseFloat(document.getElementById('com-prot').value)||null,
    carbos: parseFloat(document.getElementById('com-carb').value)||null,
    grasas: parseFloat(document.getElementById('com-gra').value)||null,
    fibra: parseFloat(document.getElementById('com-fibra').value)||null
  };
  if(!row.comida){ showToast('Falta la comida'); return; }
  // anti-duplicado: ya existe ese momento ese dia?
  const existente = state.comidas.find(c => c.fecha===fecha && c.momento.toLowerCase()===momento.toLowerCase());
  if(existente){
    const corregir = confirm(`Ya hay un ${momento} registrado ese día:\n"${existente.comida}"\n\nAceptar = CORREGIR (reemplazar por el nuevo)\nCancelar = es comida adicional (agregar aparte)`);
    if(corregir){
      const {error} = await sb.from('fenix_comidas').update(row).eq('id', existente.id);
      if(error){ showToast('Error: '+error.message); return; }
      ['com-comida','com-cal','com-prot','com-carb','com-gra','com-fibra'].forEach(id=>document.getElementById(id).value='');
      await loadAll(); actualizarFaltanHoy(); showToast('Comida corregida ✓'); return;
    }
  }
  const {error} = await sb.from('fenix_comidas').insert(row);
  if(error){ showToast('Error: '+error.message); return; }
  ['com-comida','com-cal','com-prot','com-carb','com-gra','com-fibra'].forEach(id=>document.getElementById(id).value='');
  await loadAll(); actualizarFaltanHoy(); showToast('Comida guardada ✓');
}

async function saveDia(){
  const row = {
    fecha: document.getElementById('dia-fecha').value,
    peso: parseFloat(document.getElementById('dia-peso').value)||null,
    agua: parseFloat(document.getElementById('dia-agua').value)||null,
    proteina: parseFloat(document.getElementById('dia-prot').value)||null,
    calorias: parseFloat(document.getElementById('dia-cal').value)||null,
    notas: document.getElementById('dia-notas').value.trim()||null
  };
  const {error} = await sb.from('fenix_dias').upsert(row, {onConflict:'fecha'});
  if(error){ showToast('Error: '+error.message); return; }
  ['dia-peso','dia-agua','dia-prot','dia-cal','dia-notas'].forEach(id=>document.getElementById(id).value='');
  await loadAll(); showToast('Día guardado ✓');
}

async function init(){
  renderDayCounter();
  setInterval(renderDayCounter, 1000);
  await loadAll();
  renderDashboard();
  setupPullToRefresh();
}

// ---- PULL TO REFRESH ----
function currentTab(){
  const active = document.querySelector('.tab.active');
  return active ? active.dataset.tab : 'dashboard';
}
function setupPullToRefresh(){
  let startY = 0, pulling = false;
  const ind = document.createElement('div');
  ind.id = 'ptr'; ind.textContent = '↻';
  document.body.appendChild(ind);

  window.addEventListener('touchstart', e => {
    if(window.scrollY <= 0){ startY = e.touches[0].clientY; pulling = true; }
  }, {passive:true});

  window.addEventListener('touchmove', e => {
    if(!pulling) return;
    const dy = e.touches[0].clientY - startY;
    if(dy > 0 && window.scrollY <= 0){
      const pull = Math.min(dy, 90);
      ind.style.top = (pull - 50) + 'px';
      ind.style.opacity = pull/90;
      ind.style.transform = `rotate(${pull*4}deg)`;
    }
  }, {passive:true});

  window.addEventListener('touchend', async e => {
    if(!pulling){ return; }
    const dy = (e.changedTouches[0].clientY - startY);
    pulling = false;
    if(dy > 70 && window.scrollY <= 0){
      ind.classList.add('spin');
      ind.style.top = '20px'; ind.style.opacity = 1;
      await loadAll();
      renderers[currentTab()]();
      showToast('Actualizado ✓');
      ind.classList.remove('spin');
    }
    ind.style.top = '-50px'; ind.style.opacity = 0;
  }, {passive:true});
}
init();
